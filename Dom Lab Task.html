<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        input {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }
        li {
            padding: 10px;
            border: 1px solid #ddd;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <h1>Student Management</h1>

    <div>
        <input type="text" id="nameInput" placeholder="Student Name">
        <input type="text" id="rollInput" placeholder="Roll Number">
        <button id="addBtn">Add Student</button>
    </div>

    <ul id="studentList"></ul>

    <p id="count">Total students: 0</p>

    <script>
        const nameInput = document.getElementById('nameInput');
        const rollInput = document.getElementById('rollInput');
        const addBtn = document.getElementById('addBtn');
        const studentList = document.getElementById('studentList');
        const count = document.getElementById('count');

        let students = [];
        let editIndex = -1;

        addBtn.addEventListener('click', function() {
            const name = nameInput.value.trim();
            const roll = rollInput.value.trim();

            if (name === '' || roll === '') {
                alert('Please enter both name and roll number');
                return;
            }

            if (editIndex === -1) {
                students.push({name: name, roll: roll});
            } else {
                students[editIndex] = {name: name, roll: roll};
                editIndex = -1;
                addBtn.textContent = 'Add Student';
            }

            nameInput.value = '';
            rollInput.value = '';
            displayStudents();
        });

        function displayStudents() {
            studentList.innerHTML = '';
            count.textContent = 'Total students: ' + students.length;

            students.forEach(function(student, index) {
                const li = document.createElement('li');

                const info = document.createElement('span');
                info.textContent = student.roll + ' - ' + student.name;
                li.appendChild(info);

                const editBtn = document.createElement('button');
                editBtn.textContent = 'Edit';
                editBtn.addEventListener('click', function() {
                    nameInput.value = student.name;
                    rollInput.value = student.roll;
                    editIndex = index;
                    addBtn.textContent = 'Update Student';
                });
                li.appendChild(editBtn);

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.addEventListener('click', function() {
                    if (confirm('Delete this student?')) {
                        students.splice(index, 1);
                        displayStudents();
                    }
                });
                li.appendChild(deleteBtn);

                studentList.appendChild(li);
            });
        }
    </script>
</body>
</html>
